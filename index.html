<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#a90000">
<title>Presentlista</title>
<link rel="stylesheet" href="style.css">
<script src="data.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<main class="page">
<header class="page-header">
<p class="eyebrow">Önskemål & presenter</p>
<h1 id="year-heading"></h1>
</header>
<section class="toolbar" id="search-toolbar" aria-label="Sök i listan">
<label class="search-label" for="search">Sök i listan</label>
<input id="search" type="search" placeholder="Sök mottagare, present eller butik…">
</section>
<div id="lists" aria-live="polite"></div>
<p id="empty-state" class="empty-state" hidden>Inga presenter matchar sökningen.</p>
<footer>Presentlista · <span id="footer-year"></span></footer>
</main>
</body>
</html>
